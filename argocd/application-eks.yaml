apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-fastapi-eks
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Erekle-P/redis-k8s-assignment.git
    targetRevision: main
    path: helm/python-api

    helm:
      valueFiles:
        - values-eks.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
