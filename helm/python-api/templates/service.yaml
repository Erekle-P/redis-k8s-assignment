apiVersion: v1
kind: Service
metadata:
  name: python-api
  labels:
    app: python-api
    app.kubernetes.io/managed-by: Helm

spec:
  type: {{ .Values.service.type }}

  selector:
    app: python-api

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
