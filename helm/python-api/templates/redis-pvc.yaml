{{- if .Values.redis.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  labels:
    app: redis
    app.kubernetes.io/managed-by: Helm
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}

  storageClassName: {{ .Values.redis.persistence.storageClassName }}
{{- end }}
